blueprint:
  name: Z2M IKEA Open/Close Remote - With min max postions
  description: |
    'Control your roller blind with an IKEA 2 button remote (the square ones).
    this is the remote that's been delivered by the "Fytur" and " Kadrilj"
    roller blinds.'
  domain: automation
  input:
    remote:
      name: Remote
      description: IKEA remote to use
      selector:
        entity:
          domain: sensor
    cover:
      name: Roller Blind
      description: Roller blind to control
      selector:
        target:
          entity:
            domain: cover
    min_position:
      name: Minimum Open Position
      description: The maximum percentage the blind can open (0-100).
      default: 87
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          step: 1
    max_position:
      name: Maximum Close Position
      description: The minimum percentage the blind can close (0-100).
      default: 48
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          step: 1
mode: single
max_exceeded: silent
trigger:
  - platform: state
    entity_id: !input remote
action:
  - variables:
      command: "{{ trigger.to_state.state }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ command == 'open' }}"
        sequence:
          - service: cover.set_cover_position
            target: !input cover
            data:
              position: !input min_position
      - conditions:
          - condition: template
            value_template: "{{ command == 'close' }}"
        sequence:
          - service: cover.set_cover_position
            target: !input cover
            data:
              position: !input max_position
