blueprint:
  name: ZHA IKEA Open/Close Remote - With min max postions
  description: |
    Control your roller blind with an IKEA 2 button remote (the square ones).
    This is the remote that's delivered with the "Fytur" and "Kadrilj"
    roller blinds. Requires the remote to be paired with ZHA
    (Zigbee Home Automation).
  domain: automation
  input:
    remote:
      name: Remote
      description: IKEA open/close remote to use
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: IKEA of Sweden
              model: TRADFRI open/close remote
    cover:
      name: Roller Blind
      description: Roller blind to control
      selector:
        target:
          entity:
            domain: cover
    open_position:
      name: Open Position
      description: Position the blind moves to when pressing open (0 = closed, 100 = fully open).
      default: 87
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          step: 1
    close_position:
      name: Close Position
      description: Position the blind moves to when pressing close (0 = closed, 100 = fully open).
      default: 48
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          step: 1
mode: single
max_exceeded: silent
trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote
action:
  - variables:
      command: "{{ trigger.event.data.command }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ command == 'up_open' }}"
        sequence:
          - service: cover.set_cover_position
            target: !input cover
            data:
              position: !input open_position
      - conditions:
          - condition: template
            value_template: "{{ command == 'down_close' }}"
        sequence:
          - service: cover.set_cover_position
            target: !input cover
            data:
              position: !input close_position
