blueprint:
  name: Z2M IKEA Open/Close Remote - With min max postions
  description: |
    Control your roller blind with an IKEA 2 button remote (the square ones).
    This is the remote that's delivered with the "Fytur" and "Kadrilj"
    roller blinds. Requires Zigbee2MQTT 2.0+ (uses the remote's action event entity).
  domain: automation
  input:
    remote:
      name: Remote
      description: IKEA remote action event entity (e.g. event.<remote>_action)
      selector:
        entity:
          domain: event
          integration: mqtt
    cover:
      name: Roller Blind
      description: Roller blind to control
      selector:
        target:
          entity:
            domain: cover
    open_position:
      name: Open Position
      description: Position the blind moves to when pressing open (0 = closed, 100 = fully open).
      default: 87
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          step: 1
    close_position:
      name: Close Position
      description: Position the blind moves to when pressing close (0 = closed, 100 = fully open).
      default: 48
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          step: 1
mode: single
max_exceeded: silent
trigger:
  - platform: state
    entity_id: !input remote
    not_from: unavailable
action:
  - variables:
      command: "{{ trigger.to_state.attributes.event_type }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ command == 'open' }}"
        sequence:
          - service: cover.set_cover_position
            target: !input cover
            data:
              position: !input open_position
      - conditions:
          - condition: template
            value_template: "{{ command == 'close' }}"
        sequence:
          - service: cover.set_cover_position
            target: !input cover
            data:
              position: !input close_position
